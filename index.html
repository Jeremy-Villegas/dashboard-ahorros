<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Ahorros PRO MAX</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
font-family:'Segoe UI',Arial,sans-serif;
background:#e5e7eb;
margin:0;
color:#2c3e50;
}

.header{
background:#1f2937;
color:white;
padding:15px 25px;
font-weight:bold;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1400px;
margin:20px auto;
padding:20px;
background:#f9fafb;
border-radius:10px;
}

h2{
color:#1f2937;
margin-bottom:15px;
}

h3{
color:#374151;
margin-bottom:10px;
}

.card{
background:#ffffff;
padding:20px;
margin-bottom:20px;
border-radius:8px;
border:1px solid #d1d5db;
box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

input,select,textarea{
width:100%;
padding:10px;
margin:6px 0;
border-radius:6px;
border:1px solid #cfd4da;
background:#f9fafb;
box-sizing:border-box;
}

button{
background:#2d7ff9;
color:white;
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1c5fd4;
}

.kpis{
display:flex;
gap:15px;
flex-wrap:wrap;
}

.kpi{
flex:1;
padding:15px;
border-radius:8px;
text-align:center;
color:white;
font-weight:bold;
}

.kpi.orange{
background:#ff6a00;
}

.kpi.blue{
background:#2d7ff9;
}

.kpi.green{
background:#2ecc71;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th{
background:#2c3e50;
color:white;
padding:10px;
font-size:13px;
}

td{
padding:8px;
border-bottom:1px solid #e5e7eb;
font-size:13px;
vertical-align:top;
}

tr:hover{
background:#f5f7fa;
}

td button{
margin:2px;
padding:5px 8px;
font-size:12px;
}

td button:nth-child(1){
background:#3498db;
}

td button:nth-child(2){
background:#e74c3c;
}

canvas{
margin-top:15px;
}

.archivo-item{
display:flex;
justify-content:space-between;
align-items:center;
background:#f3f4f6;
padding:8px;
margin-top:5px;
border-radius:6px;
}

.archivo-item button{
background:#e74c3c;
padding:5px 10px;
font-size:12px;
}

</style>
</head>

<body>

<div class="header">
Dashboard de Ahorros
<span>Jeremy Villegas</span>
</div>

<div class="container">

<h2>📊 Dashboard Ahorros PRO MAX</h2>

<!-- FORMULARIO -->

<div class="card">

<input id="proyecto" placeholder="Proyecto">

<input id="responsable" placeholder="Responsable">

<select id="unidad">
<option value="F&P">F&P</option>
<option value="INST">INST</option>
</select>

<select id="tipo">
<option>Material</option>
<option>Mano de obra</option>
<option>Tiempo</option>
<option>Proveedor</option>
</select>

<textarea id="descripcion"
placeholder="Descripción del ahorro o justificación"></textarea>

<label><b>Evidencias</b></label>

<input type="file" id="evidencia">

<button type="button" onclick="agregarArchivo()">
Agregar Archivo
</button>

<div id="listaArchivos"></div>

<input type="date" id="fecha">

<input type="number" id="original"
placeholder="Costo original">

<input type="number" id="optimizado"
placeholder="Costo optimizado">

<button onclick="guardar()">
Guardar
</button>

</div>

<!-- FILTROS -->

<div class="card">

<select id="filtroProyecto" onchange="cargar()">
<option value="todos">Todos los proyectos</option>
</select>

<select id="filtroResponsable" onchange="cargar()">
<option value="todos">Todos los responsables</option>
</select>

<select id="filtroTipo" onchange="cargar()">
<option value="todos">Todos los tipos</option>
<option value="Material">Material</option>
<option value="Mano de obra">Mano de obra</option>
<option value="Tiempo">Tiempo</option>
<option value="Proveedor">Proveedor</option>
</select>

<input type="date" id="filtroInicio" onchange="cargar()">

<input type="date" id="filtroFin" onchange="cargar()">

<button onclick="exportarExcel()">
Exportar a Excel
</button>

</div>

<!-- KPIs -->

<div class="card kpis">

<div class="kpi orange">
<h3>Total Original</h3>
<p id="kpiOriginal">0</p>
</div>

<div class="kpi blue">
<h3>Total Ahorro</h3>
<p id="kpiAhorro">0</p>
</div>

<div class="kpi green">
<h3>% Ahorro</h3>
<p id="kpiPorcentaje">0%</p>
</div>

</div>

<!-- GRAFICA GENERAL -->

<div class="card">
<h3>Gráfica General</h3>
<canvas id="chartGeneral"></canvas>
</div>

<!-- GRAFICA PROYECTO -->

<div class="card">
<h3>Gráfica por Proyecto</h3>
<canvas id="chartProyecto"></canvas>
</div>

<!-- TABLA -->

<div class="card">

<table>

<thead>

<tr>
<th>Fecha</th>
<th>Proyecto</th>
<th>Responsable</th>
<th>Unidad</th>
<th>Tipo</th>
<th>Descripción</th>
<th>Evidencias</th>
<th>Original</th>
<th>Optimizado</th>
<th>Ahorro</th>
<th>Acciones</th>
</tr>

</thead>

<tbody id="tabla"></tbody>

</table>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
doc,
deleteDoc,
updateDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDbGafoJEyBDRu3CUNErYWWMiTTopFSw4Y",
authDomain: "dashboard-ahorros.firebaseapp.com",
projectId: "dashboard-ahorros",
storageBucket: "dashboard-ahorros.firebasestorage.app",
messagingSenderId: "182706196966",
appId: "1:182706196966:web:582eb05fe372327f720627"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let editId=null;
let datosGlobal=[];
let archivosEvidencia=[];

/* ARCHIVOS */

window.agregarArchivo=()=>{

let input =
document.getElementById("evidencia");

if(!input.files.length){
alert("Selecciona un archivo");
return;
}

let archivo =
input.files[0];

archivosEvidencia.push(
archivo.name
);

renderArchivos();

input.value="";

};

function renderArchivos(){

let contenedor =
document.getElementById("listaArchivos");

contenedor.innerHTML="";

archivosEvidencia.forEach((a,index)=>{

contenedor.innerHTML += `

<div class="archivo-item">

<span>${a}</span>

<button
type="button"
onclick="eliminarArchivo(${index})">
X
</button>

</div>

`;

});

}

window.eliminarArchivo=(index)=>{

archivosEvidencia.splice(index,1);

renderArchivos();

};

/* GUARDAR */

window.guardar=async()=>{

let data={

proyecto:proyecto.value,
responsable:responsable.value,
unidad:unidad.value,
tipo:tipo.value,
descripcion:descripcion.value,

evidencia:
archivosEvidencia.join(", "),

fecha:fecha.value,

original:
parseFloat(original.value),

optimizado:
parseFloat(optimizado.value)

};

if(!data.proyecto
|| !data.responsable
|| !data.fecha){

return alert("Faltan datos");

}

data.ahorro=
data.original-data.optimizado;

if(editId){

await updateDoc(
doc(db,"ahorros",editId),
data
);

editId=null;

}else{

await addDoc(
collection(db,"ahorros"),
data
);

}

limpiar();

cargar();

};

/* CARGAR */

window.cargar=async()=>{

let snapshot=
await getDocs(
collection(db,"ahorros")
);

tabla.innerHTML="";

let totalOriginal=0;
let totalAhorro=0;

let proyectos=new Set();
let responsables=new Set();

let ahorroPorProyecto={};

let fProyecto=
filtroProyecto.value;

let fResponsable=
filtroResponsable.value;

let fTipo=
filtroTipo.value;

let fInicio=
filtroInicio.value;

let fFin=
filtroFin.value;

datosGlobal=[];

snapshot.forEach(docu=>{

let d=docu.data();

proyectos.add(d.proyecto);

responsables.add(
d.responsable
);

/* FILTROS */

if(fProyecto!=="todos"
&& d.proyecto!==fProyecto)
return;

if(fResponsable!=="todos"
&& d.responsable!==fResponsable)
return;

if(fTipo!=="todos"
&& d.tipo!==fTipo)
return;

if(fInicio
&& d.fecha<fInicio)
return;

if(fFin
&& d.fecha>fFin)
return;

datosGlobal.push(d);

totalOriginal+=d.original;

totalAhorro+=d.ahorro;

ahorroPorProyecto[d.proyecto]=
(ahorroPorProyecto[d.proyecto]||0)
+d.ahorro;

/* TABLA */

tabla.innerHTML+=`

<tr>

<td>${d.fecha}</td>

<td>${d.proyecto}</td>

<td>${d.responsable}</td>

<td>${d.unidad||""}</td>

<td>${d.tipo}</td>

<td>${d.descripcion||""}</td>

<td>${d.evidencia||""}</td>

<td>${d.original}</td>

<td>${d.optimizado}</td>

<td>${d.ahorro}</td>

<td>

<button onclick="editar('${docu.id}')">
Editar
</button>

<button onclick="eliminar('${docu.id}')">
Eliminar
</button>

</td>

</tr>

`;

});

/* KPIs */

kpiOriginal.innerText=
totalOriginal;

kpiAhorro.innerText=
totalAhorro;

kpiPorcentaje.innerText=
totalOriginal
? ((totalAhorro/totalOriginal)
*100).toFixed(2)+"%"
: "0%";

/* FILTRO PROYECTO */

filtroProyecto.innerHTML=
'<option value="todos">Todos los proyectos</option>';

proyectos.forEach(p=>{

filtroProyecto.innerHTML+=
`<option>${p}</option>`;

});

/* FILTRO RESPONSABLE */

filtroResponsable.innerHTML=
'<option value="todos">Todos los responsables</option>';

responsables.forEach(r=>{

filtroResponsable.innerHTML+=
`<option>${r}</option>`;

});

/* GRAFICAS */

renderGeneral(
totalOriginal,
totalAhorro
);

renderProyecto(
ahorroPorProyecto
);

};

/* GRAFICA GENERAL */

function renderGeneral(o,a){

if(window.chart1)
chart1.destroy();

window.chart1=
new Chart(chartGeneral,{

type:"bar",

data:{

labels:[
"Original",
"Ahorro"
],

datasets:[{

data:[o,a],

backgroundColor:[
"#ff6a00",
"#2ecc71"
]

}]

}

});

}

/* GRAFICA PROYECTO */

function renderProyecto(data){

if(window.chart2)
chart2.destroy();

window.chart2=
new Chart(chartProyecto,{

type:"bar",

data:{

labels:
Object.keys(data),

datasets:[{

label:
"Ahorro por proyecto",

data:
Object.values(data),

backgroundColor:
"#2d7ff9"

}]

}

});

}

/* EXPORTAR */

window.exportarExcel=()=>{

let ws=
XLSX.utils.json_to_sheet(
datosGlobal
);

let wb=
XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
wb,
ws,
"Ahorros"
);

XLSX.writeFile(
wb,
"ahorros.xlsx"
);

};

/* EDITAR */

window.editar=async(id)=>{

let docSnap=
await getDoc(
doc(db,"ahorros",id)
);

let d=
docSnap.data();

proyecto.value=d.proyecto;

responsable.value=
d.responsable;

unidad.value=d.unidad;

tipo.value=d.tipo;

descripcion.value=
d.descripcion;

fecha.value=d.fecha;

original.value=d.original;

optimizado.value=
d.optimizado;

archivosEvidencia=
d.evidencia
? d.evidencia.split(", ")
: [];

renderArchivos();

editId=id;

};

/* ELIMINAR */

window.eliminar=async(id)=>{

await deleteDoc(
doc(db,"ahorros",id)
);

cargar();

};

/* LIMPIAR */

function limpiar(){

proyecto.value="";
responsable.value="";
descripcion.value="";
original.value="";
optimizado.value="";
fecha.value="";

archivosEvidencia=[];

renderArchivos();

}

/* INICIO */

cargar();

</script>

</body>
</html>
</body>
</html>
