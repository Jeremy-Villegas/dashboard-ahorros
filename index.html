<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Ahorros FLUTEC</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:#eef2f7;
color:#1f2937;
}

.header{
background:#1f2937;
padding:15px 25px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
}

.logo-area{
display:flex;
align-items:center;
gap:15px;
}

.logo-area img{
height:60px;
background:white;
padding:5px;
border-radius:10px;
}

.container{
max-width:1700px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

input,
select,
textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #d1d5db;
}

textarea{
min-height:80px;
}

button{
background:#ff6a00;
color:white;
border:none;
padding:12px 15px;
border-radius:10px;
cursor:pointer;
margin-top:10px;
font-weight:bold;
}

button:hover{
opacity:.9;
}

.btn-danger{
background:#dc2626;
}

.btn-edit{
background:#2563eb;
}

.kpis{
display:flex;
gap:15px;
flex-wrap:wrap;
margin-bottom:20px;
}

.kpi{
flex:1;
min-width:220px;
padding:25px;
border-radius:15px;
color:white;
text-align:center;
}

.orange{
background:#ff6a00;
}

.blue{
background:#2563eb;
}

.green{
background:#16a34a;
}

.kpi-big{
background:linear-gradient(90deg,#ff6a00,#ff8c00);
padding:35px;
border-radius:20px;
color:white;
font-size:40px;
font-weight:bold;
text-align:center;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
font-size:13px;
}

th{
background:#1f2937;
color:white;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #e5e7eb;
vertical-align:top;
}

.preview-grid{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:10px;
}

.preview-item{
position:relative;
}

.preview-item img{
width:80px;
height:80px;
object-fit:cover;
border-radius:10px;
}

.preview-file{
width:80px;
height:80px;
background:#f3f4f6;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:5px;
border-radius:10px;
font-size:11px;
text-decoration:none;
color:black;
}

.preview-remove{
position:absolute;
top:-8px;
right:-8px;
width:22px;
height:22px;
border-radius:50%;
background:red;
color:white;
border:none;
font-size:11px;
cursor:pointer;
}

.toast{
position:fixed;
top:20px;
right:20px;
background:#16a34a;
color:white;
padding:15px;
border-radius:10px;
display:none;
z-index:9999;
}

</style>

</head>

<body>

<div class="header">

<div class="logo-area">

<img src="https://github.com/Jeremy-Villegas/dashboard-ahorros/blob/main/LOGO%20FLUTEC.png?raw=true">

<div>

<div style="font-size:26px;font-weight:bold;">
Dashboard de Ahorros
</div>

<div style="font-size:13px;opacity:.8;">
FLUTEC
</div>

</div>

</div>

</div>

<div class="container">

<div class="kpi-big">

💰 AHORRO TOTAL

<br>

<span id="ahorroAnual">$0</span>

</div>

<div class="card">

<h2>Nuevo Registro</h2>

<input id="proyecto" placeholder="Proyecto">

<input id="responsable" placeholder="Responsable">

<select id="unidad">
<option>F&P</option>
<option>INST</option>
</select>

<select id="tipo">
<option>Material</option>
<option>Mano de obra</option>
<option>Tiempo</option>
<option>Proveedor</option>
</select>

<textarea id="descripcion" placeholder="Descripción"></textarea>

<textarea id="comentarios" placeholder="Comentarios"></textarea>

<input type="date" id="fecha">

<input type="number" id="original" placeholder="Costo original">

<input type="number" id="optimizado" placeholder="Costo optimizado">

<input type="file" id="evidencia" multiple>

<button type="button" onclick="agregarArchivo()">
Agregar archivo
</button>

<div id="previewArchivos" class="preview-grid"></div>

<button onclick="guardar()">
Guardar Registro
</button>

</div>

<div class="card">

<input
id="busqueda"
placeholder="Buscar..."
onkeyup="cargar()">

<button onclick="exportarExcel()">
Exportar Excel
</button>

</div>

<div class="kpis">

<div class="kpi orange">
<h3>Total Original</h3>
<p id="kpiOriginal">$0</p>
</div>

<div class="kpi blue">
<h3>Total Ahorro</h3>
<p id="kpiAhorro">$0</p>
</div>

<div class="kpi green">
<h3>% Ahorro</h3>
<p id="kpiPorcentaje">0%</p>
</div>

</div>

<div class="card">

<h3>Gráfica General</h3>

<canvas id="chartGeneral"></canvas>

</div>

<div class="card">

<h3>Registros</h3>

<table>

<thead>

<tr>

<th>Fecha</th>
<th>Proyecto</th>
<th>Responsable</th>
<th>Unidad</th>
<th>Tipo</th>
<th>Descripción</th>
<th>Evidencias</th>
<th>Ahorro</th>
<th>Acciones</th>

</tr>

</thead>

<tbody id="tabla"></tbody>

</table>

</div>

</div>

<div id="toast" class="toast"></div>

<script>

let datos=
JSON.parse(
localStorage.getItem("ahorros")
)||[];

let archivosActuales=[];

function mostrarToast(msg){

toast.innerText=msg;

toast.style.display="block";

setTimeout(()=>{
toast.style.display="none";
},2500);

}

function agregarArchivo(){

let files=evidencia.files;

if(!files.length) return;

Array.from(files).forEach(file=>{

let reader=new FileReader();

reader.onload=function(e){

archivosActuales.push({

nombre:file.name,
tipo:file.type,
url:e.target.result

});

renderPreview();

};

reader.readAsDataURL(file);

});

evidencia.value="";

}

function renderPreview(){

previewArchivos.innerHTML="";

archivosActuales.forEach((a,index)=>{

let html="";

if(a.tipo.includes("image")){

html=`

<div class="preview-item">

<button
class="preview-remove"
onclick="eliminarArchivo(${index})">

X

</button>

<a href="${a.url}" target="_blank">

<img src="${a.url}">

</a>

</div>

`;

}else{

html=`

<div class="preview-item">

<button
class="preview-remove"
onclick="eliminarArchivo(${index})">

X

</button>

<a
href="${a.url}"
target="_blank"
class="preview-file">

${a.nombre}

</a>

</div>

`;

}

previewArchivos.innerHTML+=html;

});

}

function eliminarArchivo(index){

archivosActuales.splice(index,1);

renderPreview();

}

function guardar(){

let originalNum=
parseFloat(original.value)||0;

let optimizadoNum=
parseFloat(optimizado.value)||0;

let registro={

id:Date.now(),

fecha:fecha.value,

proyecto:proyecto.value,

responsable:responsable.value,

unidad:unidad.value,

tipo:tipo.value,

descripcion:descripcion.value,

comentarios:comentarios.value,

original:originalNum,

optimizado:optimizadoNum,

ahorro:
originalNum-optimizadoNum,

evidencias:[...archivosActuales]

};

datos.push(registro);

localStorage.setItem(
"ahorros",
JSON.stringify(datos)
);

mostrarToast(
"Registro guardado"
);

limpiar();

cargar();

}

function editarRegistro(id){

let registro=
datos.find(d=>d.id===id);

if(!registro) return;

proyecto.value=registro.proyecto;
responsable.value=registro.responsable;
unidad.value=registro.unidad;
tipo.value=registro.tipo;
descripcion.value=registro.descripcion;
comentarios.value=registro.comentarios;
fecha.value=registro.fecha;
original.value=registro.original;
optimizado.value=registro.optimizado;

archivosActuales=
registro.evidencias || [];

renderPreview();

datos=
datos.filter(d=>d.id!==id);

localStorage.setItem(
"ahorros",
JSON.stringify(datos)
);

cargar();

mostrarToast(
"Registro cargado para edición"
);

}

function eliminarRegistro(id){

let confirmar=
confirm("¿Eliminar registro?");

if(!confirmar) return;

datos=
datos.filter(d=>d.id!==id);

localStorage.setItem(
"ahorros",
JSON.stringify(datos)
);

cargar();

}

function cargar(){

tabla.innerHTML="";

let totalOriginal=0;
let totalAhorro=0;

let busquedaTexto=
busqueda.value.toLowerCase();

datos.forEach(d=>{

let texto=
JSON.stringify(d).toLowerCase();

if(!texto.includes(busquedaTexto))
return;

totalOriginal+=d.original;
totalAhorro+=d.ahorro;

let evidenciasHTML="";

(d.evidencias||[]).forEach(a=>{

if(a.tipo.includes("image")){

evidenciasHTML+=`

<a href="${a.url}" target="_blank">

<img
src="${a.url}"
style="
width:50px;
height:50px;
border-radius:8px;
margin:2px;
">

</a>

`;

}else{

evidenciasHTML+=`

<a
href="${a.url}"
target="_blank">

${a.nombre}

</a><br>

`;

}

});

tabla.innerHTML+=`

<tr>

<td>${d.fecha}</td>
<td>${d.proyecto}</td>
<td>${d.responsable}</td>
<td>${d.unidad}</td>
<td>${d.tipo}</td>

<td>

${d.descripcion}

<br>

<small>
${d.comentarios||""}
</small>

</td>

<td>${evidenciasHTML}</td>

<td>
$${d.ahorro.toLocaleString()}
</td>

<td>

<button
class="btn-edit"
onclick="editarRegistro(${d.id})">

Editar

</button>

<br><br>

<button
class="btn-danger"
onclick="eliminarRegistro(${d.id})">

Eliminar

</button>

</td>

</tr>

`;

});

kpiOriginal.innerText=
"$"+totalOriginal.toLocaleString();

kpiAhorro.innerText=
"$"+totalAhorro.toLocaleString();

kpiPorcentaje.innerText=
totalOriginal
?
(
(totalAhorro/totalOriginal)*100
).toFixed(2)+"%"
:
"0%";

ahorroAnual.innerText=
"$"+totalAhorro.toLocaleString();

renderGrafica(
totalOriginal,
totalAhorro
);

}

function renderGrafica(original,ahorro){

if(window.chart1)
chart1.destroy();

window.chart1=
new Chart(chartGeneral,{

type:"bar",

data:{

labels:[
"Original",
"Ahorro"
],

datasets:[{

data:[
original,
ahorro
],

backgroundColor:[
"#2563eb",
"#ff6a00"
]

}]

}

});

}

function exportarExcel(){

let ws=
XLSX.utils.json_to_sheet(datos);

let wb=
XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
wb,
ws,
"Ahorros"
);

XLSX.writeFile(
wb,
"ahorros.xlsx"
);

}

function limpiar(){

proyecto.value="";
responsable.value="";
descripcion.value="";
comentarios.value="";
fecha.value="";
original.value="";
optimizado.value="";

archivosActuales=[];

renderPreview();

}

cargar();

</script>

</body>
</html>
